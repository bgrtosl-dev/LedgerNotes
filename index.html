<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ledger Notes</title>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<!-- Define Module.onRuntimeInitialized BEFORE loading opencv.js -->
<script>
var Module = {
  onRuntimeInitialized() {
    console.log("OpenCV.js is fully loaded and ready.");
    window.openCVReady = true;
  }
};
</script>
<!-- OpenCV.js -->
<script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
<style>
body { margin: 0; padding: 20px; background: #eeeeee; font-family: Arial, sans-serif; }
.app { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 3px 15px rgba(0,0,0,.12); }
h1 { margin: 0 0 8px 0; font-size: 26px; display: flex; align-items: center; gap: 10px; }
.controls { display: flex; gap: 12px; align-items: center; margin-bottom: 0; flex-wrap: wrap; }
select, button { font-size: 17px; padding: 6px 12px; border: 1px solid #999; border-radius: 6px; background: white; cursor: pointer; }
.clef-toggle-btn { background: #2563eb; color: white; border: none; font-weight: bold; transition: background 0.2s; }
.clef-toggle-btn:hover { background: #1d4ed8; }
.step-btn-group { display: flex; gap: 4px; }
.step-btn { padding: 6px 10px; font-weight: bold; background: #f3f4f6; }
.step-btn:hover { background: #e5e7eb; }
#score { width: 100%; height: 380px; background: white; overflow: visible; }
</style>
</head>
<body>
<div class="app">
<h1>
    <span id="qr-btn" style="cursor: pointer; display: inline-flex; align-items: center; vertical-align: middle;" title="Show QR Code">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <path d="M7 7h1v1H7z"></path>
            <path d="M18 7h1v1h-1z"></path>
            <path d="M18 18h1v1h-1z"></path>
            <path d="M7 18h1v1H7z"></path>
            <path d="M10 10h4v4h-4z"></path>
        </svg>
    </span>
    Ledger Notes
</h1>
<div class="controls">
<button id="clefToggleBtn" class="clef-toggle-btn">𝄞 Treble</button>
<button id="cameraBtn" class="step-btn" title="Open Camera Tool" style="background: #2563eb; color: white;">📷</button>
<select id="noteSelect">
  <option value="C" selected>C</option>
  <option value="D">D</option>
  <option value="E">E</option>
  <option value="F">F</option>
  <option value="G">G</option>
  <option value="A">A</option>
  <option value="B">B</option>
</select>
<div class="step-btn-group">
  <button id="btnUp2" class="step-btn" title="Move 2 notes up">++</button>
  <button id="btnUp1" class="step-btn" title="Move 1 note up">+</button>
  <button id="btnDown1" class="step-btn" title="Move 1 note down">-</button>
  <button id="btnDown2" class="step-btn" title="Move 2 notes down">--</button>
</div>
</div>
<div id="score"></div>
</div>

<!-- Camera Overlay Modal -->
<div id="camera-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; flex-direction: column; align-items: center; justify-content: center;">
    <video id="camera-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0;"></video>
    <canvas id="camera-overlay-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none;"></canvas>
    
    <!-- Direction Buttons -->
    <button id="btnNoteAbove" style="position: absolute; top: 20px; left: 20px; z-index: 2001; padding: 8px 14px; font-size: 14px; font-weight: bold; border-radius: 6px; border: 2px solid white; background: #16a34a; color: white; cursor: pointer;">Note Above Staff</button>
    <button id="btnNoteBelow" style="position: absolute; bottom: 80px; left: 20px; z-index: 2001; padding: 8px 14px; font-size: 14px; font-weight: bold; border-radius: 6px; border: 2px solid white; background: #666; color: white; cursor: pointer;">Note Below Staff</button>

    <!-- Red Cross Overlay -->
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center;">
        <div style="position: relative; width: 100%; height: 100%;">
            <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: red; transform: translateY(-50%);"></div>
            <div style="position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: red; transform: translateX(-50%);"></div>
        </div>
    </div>

    <!-- Live Offset HUD Badge -->
    <div id="live-offset-display" style="position: absolute; top: 20px; right: 20px; z-index: 2001; background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 8px; font-size: 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3);">Offset: 0.0</div>

    <div style="position: absolute; bottom: 30px; z-index: 2001; display: flex; gap: 15px;">
        <button id="closeCameraBtn" style="padding: 10px 20px; font-size: 16px; background: #666; color: white; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
    </div>
    <canvas id="camera-canvas" style="display: none;"></canvas>
</div>

<!-- QR Modal -->
<div id="qr-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 260px;">
        <p style="margin-top: 0; margin-bottom: 10px; font-weight: 600; font-size: 0.95rem;">Ledger Notes app</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://bgrtosl-dev.github.io/LedgerNotes/" alt="QR Code" style="display: block; margin: 0 auto 10px auto; width: 180px; height: 180px;">
        <div style="font-size: 0.65rem; color: #475569; word-break: break-all; font-weight: 500;">
            <a href="https://bgrtosl-dev.github.io/LedgerNotes/" target="_blank" style="color: #2563eb; text-decoration: none;">https://bgrtosl-dev.github.io/LedgerNotes/</a>
        </div>
    </div>
</div>

<script>
window.addEventListener("load", function () {
const VF = Vex.Flow;
let clef = "treble";
let selectedLetter = "C";
let searchDirection = "above"; // "above" or "below"

/* PIANO: A0 - C8 */
const piano = [];
const natural = [ "C", "D", "E", "F", "G", "A", "B" ];
for (let octave = 0; octave <= 8; octave++) {
  for (const letter of natural) {
    if ( octave === 0 && letter !== "A" && letter !== "B" ) { continue; }
    if ( octave === 8 && letter !== "C" ) { continue; }
    piano.push({ letter, octave });
  }
}

/* DIATONIC POSITION */
const letterIndex = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
function pitchPosition(letter, octave) {
  return octave * 7 + letterIndex[letter];
}

/* LEDGER POSITION */
function ledgerLineCount(letter, octave) {
  const p = pitchPosition(letter, octave);
  let bottom;
  let top;
  if (clef === "treble") {
    bottom = pitchPosition("E", 4);
    top = pitchPosition("F", 5);
  } else {
    bottom = pitchPosition("G", 2);
    top = pitchPosition("A", 3);
  }
  if (p >= bottom && p <= top) { return 0; }
  if (p > top) { return (p - top) / 2; }
  return -(bottom - p) / 2;
}

/* DRAW */
function draw() {
  const score = document.getElementById("score");
  score.innerHTML = "";
  const renderer = new VF.Renderer( score, VF.Renderer.Backends.SVG );
  renderer.resize( 600, 380 );
  const context = renderer.getContext();

  const stave = new VF.Stave( 50, 125, 125 );
  stave.addClef(clef);
  stave.setContext(context);
  stave.draw();

  const notes = piano.filter( n => n.letter === selectedLetter );
  const keys = notes.map(function (n) {
    return ( n.letter.toLowerCase() + "/" + n.octave );
  });

  const chord = new VF.StaveNote({ clef: clef, keys: keys, duration: "w" });
  const voice = new VF.Voice({ numbeats: 4, beatvalue: 4 });
  voice.addTickables([ chord ]);
  new VF.Formatter().joinVoices([voice]).format( [voice], 80 );
  voice.draw( context, stave );

  drawLabels( chord, notes );
}

/* LABELS */
function drawLabels(chord, notes) {
  const svg = document.querySelector( "#score svg" );
  if (!svg) { return; }
  const ys = chord.getYs();
  let noteX = 0;
  if ( typeof chord.getAbsoluteX === "function" ) {
    noteX = chord.getAbsoluteX();
  }
  const labelX = noteX + 25;
  notes.forEach(function (note, index) {
    const y = ys[index];
    const count = ledgerLineCount( note.letter, note.octave );
    let countText = "";
    if (count !== 0) {
      const formattedCount = Number.isInteger(count) ? String(count) : count.toFixed(1);
      const sign = count > 0 ? "+" : "";
      countText = "/" + sign + formattedCount;
    }
    const label = note.letter + note.octave + countText;

    const text = document.createElementNS( "http://www.w3.org/2000/svg", "text" );
    text.setAttribute( "x", labelX );
    text.setAttribute( "y", y + 4 );
    text.setAttribute( "font-family", "Arial, sans-serif" );
    text.setAttribute( "font-size", "11" );
    text.setAttribute( "fill", "#333" );
    text.textContent = label;
    svg.appendChild(text);
  });
}

/* NOTE SHIFT HELPER */
function shiftNote(steps) {
  const currentIndex = natural.indexOf(selectedLetter);
  let newIndex = (currentIndex + steps) % natural.length;
  if (newIndex < 0) {
    newIndex += natural.length;
  }
  selectedLetter = natural[newIndex];
  document.getElementById("noteSelect").value = selectedLetter;
  draw();
}

/* CONTROLS */
const clefBtn = document.getElementById("clefToggleBtn");
clefBtn.addEventListener("click", function () {
  const currentIndex = natural.indexOf(selectedLetter);
  let newIndex;

  if (clef === "treble") {
    clef = "bass";
    this.textContent = "𝄢 Bass";
    newIndex = (currentIndex + 2) % natural.length;
  } else {
    clef = "treble";
    this.textContent = "𝄞 Treble";
    newIndex = (currentIndex - 2 + natural.length) % natural.length;
  }

  selectedLetter = natural[newIndex];
  document.getElementById("noteSelect").value = selectedLetter;
  draw();
});

document.getElementById("noteSelect").addEventListener("change", function () {
  selectedLetter = this.value;
  draw();
});

document.getElementById("btnUp2").addEventListener("click", () => shiftNote(2));
document.getElementById("btnUp1").addEventListener("click", () => shiftNote(1));
document.getElementById("btnDown1").addEventListener("click", () => shiftNote(-1));
document.getElementById("btnDown2").addEventListener("click", () => shiftNote(-2));

/* CAMERA TOOL LOGIC & TOUCH-TO-SELECT INTERACTION */
let mediaStream = null;
let processingInterval = null;
let latestAnalysisData = null;

const cameraOverlay = document.getElementById("camera-overlay");
const cameraVideo = document.getElementById("camera-video");
const cameraCanvas = document.getElementById("camera-canvas");
const overlayCanvas = document.getElementById("camera-overlay-canvas");
const liveOffsetDisplay = document.getElementById("live-offset-display");
const btnNoteAbove = document.getElementById("btnNoteAbove");
const btnNoteBelow = document.getElementById("btnNoteBelow");

btnNoteAbove.addEventListener("click", (e) => {
  e.stopPropagation();
  searchDirection = "above";
  btnNoteAbove.style.background = "#16a34a";
  btnNoteBelow.style.background = "#666";
});

btnNoteBelow.addEventListener("click", (e) => {
  e.stopPropagation();
  searchDirection = "below";
  btnNoteBelow.style.background = "#16a34a";
  btnNoteAbove.style.background = "#666";
});

document.getElementById("cameraBtn").addEventListener("click", async () => {
  if (!window.openCVReady || typeof cv === "undefined") {
    alert("OpenCV is still loading or failed to initialize. Please wait a moment and try again.");
    return;
  }
  cameraOverlay.style.display = "flex";
  latestAnalysisData = null;
  searchDirection = "above";
  btnNoteAbove.style.background = "#16a34a";
  btnNoteBelow.style.background = "#666";

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" } }
    });
  } catch (err) {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (e) {
      alert("Camera access denied or unavailable.");
      cameraOverlay.style.display = "none";
    }
  }
  if (mediaStream) {
    cameraVideo.srcObject = mediaStream;
    startRealtimeAnalysis();
  }
});

document.getElementById("closeCameraBtn").addEventListener("click", () => {
  stopCamera();
});

/* Touch anywhere on overlay to select current note value and exit */
cameraOverlay.addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") return;
  if (latestAnalysisData) {
    const { halfStepOffset } = latestAnalysisData;
    const basePitch = (clef === "treble") ? pitchPosition("E", 4) : pitchPosition("G", 2);
    const targetPitch = basePitch + Math.round(halfStepOffset);
    const letterIndexVal = ((targetPitch % 7) + 7) % 7;
    selectedLetter = natural[letterIndexVal];

    document.getElementById("noteSelect").value = selectedLetter;
    draw();
  }
  stopCamera();
});

function stopCamera() {
  if (processingInterval) {
    clearInterval(processingInterval);
    processingInterval = null;
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }
  cameraOverlay.style.display = "none";
}

function detectStavesSlantStack(gray, cols, rows) {
  let bandStart = Math.floor(cols * 0.375);
  let bandEnd = Math.floor(cols * 0.625);
  let bandWidth = bandEnd - bandStart;

  let roi = gray.roi(new cv.Rect(bandStart, 0, bandWidth, rows));

  let bestAngle = 0;
  let maxVariance = -1;
  let bestProfile = new Array(rows).fill(0);

  for (let angle = -5; angle <= 5; angle += 1) {
    let center = new cv.Point(roi.cols / 2, roi.rows / 2);
    let rotMat = cv.getRotationMatrix2D(center, angle, 1.0);
    let rotated = new cv.Mat();
    cv.warpAffine(roi, rotated, rotMat, roi.size(), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255));

    let profile = new Array(rows).fill(0);
    let pRows = rotated.rows;
    let pCols = rotated.cols;
    for (let y = 0; y < pRows; y++) {
      let sum = 0;
      for (let x = 0; x < pCols; x++) {
        sum += (255 - rotated.ucharAt(y, x));
      }
      profile[y] = sum / pCols;
    }

    let mean = profile.reduce((a, b) => a + b, 0) / pRows;
    let variance = profile.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / pRows;

    if (variance > maxVariance) {
      maxVariance = variance;
      bestAngle = angle;
      bestProfile = profile;
    }

    rotMat.delete();
    rotated.delete();
  }
  roi.delete();

  let minima = [];
  let pRows = bestProfile.length;
  let meanVal = bestProfile.reduce((a,b)=>a+b,0) / pRows;
  for (let y = 2; y < pRows - 2; y++) {
    if (bestProfile[y] > bestProfile[y-1] && bestProfile[y] > bestProfile[y-2] && 
        bestProfile[y] >= bestProfile[y+1] && bestProfile[y] >= bestProfile[y+2] &&
        bestProfile[y] > meanVal * 1.2) {
      minima.push(y);
    }
  }

  let staves = [];
  for (let i = 0; i <= minima.length - 5; i++) {
    let group = minima.slice(i, i + 5);
    let d1 = group[1] - group[0];
    let d2 = group[2] - group[1];
    let d3 = group[3] - group[2];
    let d4 = group[4] - group[3];
    let avgD = (d1 + d2 + d3 + d4) / 4;
    let maxDiff = Math.max(Math.abs(d1 - avgD), Math.abs(d2 - avgD), Math.abs(d3 - avgD), Math.abs(d4 - avgD));

    if (avgD > 6 && avgD < 60 && maxDiff < avgD * 0.3) {
      staves.push({ lines: group, spacing: avgD, angle: bestAngle });
      i += 4;
    }
  }

  return { staves, profile: bestProfile, bestAngle };
}

function startRealtimeAnalysis() {
  processingInterval = setInterval(() => {
    if (!cameraVideo.videoWidth || cameraOverlay.style.display === "none") return;

    overlayCanvas.width = cameraVideo.videoWidth;
    overlayCanvas.height = cameraVideo.videoHeight;
    const overlayCtx = overlayCanvas.getContext("2d");
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

    cameraCanvas.width = cameraVideo.videoWidth;
    cameraCanvas.height = cameraVideo.videoHeight;
    const ctx = cameraCanvas.getContext("2d");
    ctx.drawImage(cameraVideo, 0, 0);

    if (window.openCVReady && typeof cv !== "undefined" && cv.Mat) {
      try {
        let src = cv.imread(cameraCanvas);
        let fullGray = new cv.Mat();
        cv.cvtColor(src, fullGray, cv.COLOR_RGBA2GRAY, 0);

        // Search only the selected half image (top half for "above", bottom half for "below")
        let halfHeight = Math.floor(fullGray.rows / 2);
        let roiRect = (searchDirection === "above") 
          ? new cv.Rect(0, 0, fullGray.cols, halfHeight)
          : new cv.Rect(0, halfHeight, fullGray.cols, fullGray.rows - halfHeight);
        
        let gray = fullGray.roi(roiRect);
        let yOffset = (searchDirection === "above") ? 0 : halfHeight;

        let { staves, profile, bestAngle } = detectStavesSlantStack(gray, gray.cols, gray.rows);

        // Adjust profile length and draw waveform relative to full frame
        if (profile && profile.length > 0) {
          let maxVal = Math.max(...profile, 1);
          let graphWidth = fullGray.cols * 0.10;
          let graphCenterX = fullGray.cols * 0.5;
          let rad = bestAngle * Math.PI / 180;
          let tanVal = Math.tan(rad);

          overlayCtx.fillStyle = "rgba(255, 0, 0, 0.25)";
          overlayCtx.strokeStyle = "rgba(255, 0, 0, 0.8)";
          overlayCtx.lineWidth = 1.5;

          overlayCtx.beginPath();
          let startY = yOffset;
          let startX = graphCenterX + (startY - fullGray.rows / 2) * tanVal;
          overlayCtx.moveTo(startX, startY);

          for (let y = 0; y < profile.length; y++) {
            let amplitude = (profile[y] / maxVal) * graphWidth;
            let baseY = yOffset + y;
            let baseX = graphCenterX + (baseY - fullGray.rows / 2) * tanVal;
            let x = baseX + amplitude;
            overlayCtx.lineTo(x, baseY);
          }
          
          let endY = yOffset + profile.length - 1;
          let endX = graphCenterX + (endY - fullGray.rows / 2) * tanVal;
          overlayCtx.lineTo(endX, endY);
          overlayCtx.closePath();
          overlayCtx.fill();
          overlayCtx.stroke();
        }

        // Find staff closest to screen center (red cross)
        if (staves.length > 0) {
          let centerY = fullGray.rows / 2;
          // Shift staff line absolute Y coordinates back to full frame space
          staves.forEach(staff => {
            staff.lines = staff.lines.map(y => y + yOffset);
          });

          let closestStaff = staves.reduce((prev, curr) => 
            Math.abs(curr.lines[2] - centerY) < Math.abs(prev.lines[2] - centerY) ? curr : prev
          );

          overlayCtx.lineWidth = 2.5;
          overlayCtx.strokeStyle = "rgba(0, 255, 0, 0.9)";

          let rad = closestStaff.angle * Math.PI / 180;
          let tanVal = Math.tan(rad);
          let midX = fullGray.cols * 0.5;

          // Staff lines: 25% screen width centered
          let staffWidth = fullGray.cols * 0.25;
          let staffStartX = midX - staffWidth / 2;
          let staffEndX = midX + staffWidth / 2;

          closestStaff.lines.forEach(lineY => {
            let yStart = lineY + (staffStartX - midX) * tanVal;
            let yEnd = lineY + (staffEndX - midX) * tanVal;

            overlayCtx.beginPath();
            overlayCtx.moveTo(staffStartX, yStart);
            overlayCtx.lineTo(staffEndX, yEnd);
            overlayCtx.stroke();
          });

          // Calculate offset relative to bottom line (Line 4)
          let bottomLineY = closestStaff.lines[4];
          let topLineY = closestStaff.lines[0];
          let halfStepSize = closestStaff.spacing / 2;
          
          let rawOffset = (bottomLineY - centerY) / halfStepSize;
          let roundedHalfStep = Math.round(rawOffset * 2) / 2;

          latestAnalysisData = { halfStepOffset: roundedHalfStep };
          let signStr = roundedHalfStep > 0 ? "+" : "";
          liveOffsetDisplay.textContent = `Offset: ${signStr}${roundedHalfStep.toFixed(1)} steps`;

          // Ledger lines: 10% screen width centered, bright green
          if (centerY < topLineY || centerY > bottomLineY) {
            let ledgerWidth = fullGray.cols * 0.10;
            let ledgerStartX = midX - ledgerWidth / 2;
            let ledgerEndX = midX + ledgerWidth / 2;

            overlayCtx.strokeStyle = "rgba(0, 255, 0, 0.9)";
            overlayCtx.lineWidth = 2;

            if (centerY < topLineY) {
              let topOffsetSteps = Math.round((topLineY - centerY) / halfStepSize);
              for (let hs = 9; hs <= 8 + topOffsetSteps; hs += 2) {
                let ledgerY = topLineY - (hs - 8) * halfStepSize;
                let lStart = ledgerY + (ledgerStartX - midX) * tanVal;
                let lEnd = ledgerY + (ledgerEndX - midX) * tanVal;
                overlayCtx.beginPath();
                overlayCtx.moveTo(ledgerStartX, lStart);
                overlayCtx.lineTo(ledgerEndX, lEnd);
                overlayCtx.stroke();
              }
            } else if (centerY > bottomLineY) {
              let botOffsetSteps = Math.round((centerY - bottomLineY) / halfStepSize);
              for (let hs = 1; hs <= botOffsetSteps; hs += 2) {
                let ledgerY = bottomLineY + hs * halfStepSize;
                let lStart = ledgerY + (ledgerStartX - midX) * tanVal;
                let lEnd = ledgerY + (ledgerEndX - midX) * tanVal;
                overlayCtx.beginPath();
                overlayCtx.moveTo(ledgerStartX, lStart);
                overlayCtx.lineTo(ledgerEndX, lEnd);
                overlayCtx.stroke();
              }
            }
          }
        } else {
          liveOffsetDisplay.textContent = "Offset: --";
        }

        src.delete();
        fullGray.delete();
        gray.delete();
      } catch (err) {
        console.error("OpenCV frame processing error:", err);
      }
    }
  }, 150);
}

/* QR Modal events */
const qrBtn = document.getElementById("qr-btn");
const qrModal = document.getElementById("qr-modal");
if (qrBtn && qrModal) {
    qrBtn.addEventListener("click", () => {
        qrModal.style.display = "flex";
    });
    qrModal.addEventListener("click", (e) => {
        if (e.target === qrModal) {
            qrModal.style.display = "none";
        }
    });
}

/* INITIAL DRAW */
draw();
});

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
</body>
</html>
